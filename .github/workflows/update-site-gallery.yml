name: Update ALTAIR gallery
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update gallery and call button
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''
<style id="altair-gallery-update">
.call-fixed{position:fixed;right:18px;bottom:18px;z-index:30;display:flex;align-items:center;gap:9px;background:#d6a34a;color:#17130d;padding:13px 18px;font-weight:900;border-radius:2px;box-shadow:0 8px 28px rgba(0,0,0,.35)}
.before-after-wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.before-after{position:relative;height:520px;overflow:hidden;background:#111a21;user-select:none}
.before-after .ba-after,.before-after .ba-before{position:absolute;inset:0;background-size:cover;background-position:center}
.before-after .ba-before{width:50%;overflow:hidden;z-index:2;border-right:2px solid #d6a34a}
.before-after .ba-before img,.before-after .ba-after img{position:absolute;width:100%;height:100%;object-fit:cover;max-width:none}
.before-after .ba-before img{width:200%}
.ba-range{position:absolute;left:0;right:0;bottom:18px;z-index:5;margin:auto;width:90%;accent-color:#d6a34a}
.ba-label{position:absolute;top:16px;z-index:6;background:rgba(7,16,24,.82);padding:7px 11px;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.ba-label.before{left:16px}.ba-label.after{right:16px}
.ref-note{color:#a7adb1;font-size:13px;margin:0 0 28px}
@media(max-width:560px){.call-fixed{right:12px;bottom:12px;padding:12px 15px}.before-after-wrap{grid-template-columns:1fr}.before-after{height:360px}}
</style>
'''
          if 'id="altair-gallery-update"' not in s: s=s.replace('</head>',css+'</head>',1)
          old=re.search(r'<section id="works">.*?</section>',s,re.S)
          new='''<section id="works"><div class="container"><div class="section-head reveal"><div><div class="section-kicker">04 / Визуальные примеры</div><h2>До.<br>После.</h2></div><p class="section-intro">Показываем формат результата, который можно получить после ремонта. Фотографии ниже — интерьерные референсы, а не наши выполненные объекты.</p></div><p class="ref-note">Ниже — демонстрационный ползунок: слева пример пустого пространства, справа — пример готового интерьера. Когда появятся реальные объекты ALTAIR, заменим их на настоящие фото «до / после».</p><div class="before-after-wrap reveal"><div class="before-after"><div class="ba-after"><img src="https://images.unsplash.com/photo-1600607688969-a5bfcd646154?auto=format&fit=crop&w=1400&q=85" alt="Готовый современный интерьер"></div><div class="ba-before" id="baBefore"><img src="https://images.unsplash.com/photo-1600566753086-00f18fb6b3ea?auto=format&fit=crop&w=1400&q=85" alt="Интерьер до ремонта — пример"></div><span class="ba-label before">До — пример</span><span class="ba-label after">После — пример</span><input class="ba-range" id="baRange" type="range" min="0" max="100" value="50" aria-label="Сравнить до и после"></div><div class="gallery"><div class="g1"><img src="https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=1200&q=85" alt="Современная гостиная"></div><div><img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=900&q=85" alt="Современный интерьер"></div><div><img src="https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?auto=format&fit=crop&w=900&q=85" alt="Современная отделка"></div><div><img src="https://images.unsplash.com/photo-1600607688969-a5bfcd646154?auto=format&fit=crop&w=900&q=85" alt="Современная кухня"></div></div></div></div></section>'''
          if old: s=s[:old.start()]+new+s[old.end():]
          if 'class="call-fixed"' not in s: s=s.replace('</header>','</header><a class="call-fixed" href="tel:+77073749855" aria-label="Позвонить в ALTAIR GROUP">☎ Позвонить</a>',1)
          script='''
<script id="altair-gallery-script">
const baRange=document.getElementById('baRange'),baBefore=document.getElementById('baBefore');if(baRange&&baBefore){const upd=()=>baBefore.style.width=baRange.value+'%';baRange.addEventListener('input',upd);upd();}
</script>
'''
          if 'id="altair-gallery-script"' not in s: s=s.replace('</body>',script+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve ALTAIR gallery and add call button"
          git push
          git rm .github/workflows/update-site-gallery.yml
          git commit -m "Remove temporary gallery update workflow"
          git push
