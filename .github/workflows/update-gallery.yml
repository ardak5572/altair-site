name: Update ALTAIR gallery
on:
  push:
    paths:
      - trigger-gallery.txt
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace gallery and add call button
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('<section id="works">')
          end=s.index('</section>', start)+len('</section>')
          new='''<section id="works"><div class="container"><div class="section-head reveal"><div><div class="section-kicker">04 / Примеры ремонта</div><h2>До →<br>После.</h2></div><p class="section-intro">Примеры ремонта квартир. Потяните ползунок — слева состояние до ремонта, справа результат после ремонта. Это не объекты ALTAIR GROUP.</p></div><div class="ba-grid reveal"><article class="ba-card"><div class="ba-title">Гостиная</div><div class="ba-slider" data-pos="50"><div class="ba-layer ba-before" style="background-image:url('https://frankfurt.apollo.olxcdn.com/v1/files/vuojw6eal3zr3-BG/image%3Bs%3D1536x1024')"></div><div class="ba-layer ba-after" style="background-image:url('https://frankfurt.apollo.olxcdn.com/v1/files/vuojw6eal3zr3-BG/image%3Bs%3D1536x1024')"></div><div class="ba-label before">ДО</div><div class="ba-label after">ПОСЛЕ</div><input class="ba-range" type="range" min="0" max="100" value="50" aria-label="Сравнить до и после"></div><p>Пример преобразования жилой комнаты после ремонта.</p></article><article class="ba-card"><div class="ba-title">Кухня</div><div class="ba-slider" data-pos="50"><div class="ba-layer ba-before" style="background-image:url('https://centerstone.ae/wp-content/uploads/2023/09/photo-output.jpg')"></div><div class="ba-layer ba-after" style="background-image:url('https://centerstone.ae/wp-content/uploads/2023/09/photo-output.jpg')"></div><div class="ba-label before">ДО</div><div class="ba-label after">ПОСЛЕ</div><input class="ba-range" type="range" min="0" max="100" value="50" aria-label="Сравнить до и после"></div><p>Пример капитального обновления кухни.</p></article><article class="ba-card"><div class="ba-title">Санузел</div><div class="ba-slider" data-pos="50"><div class="ba-layer ba-before" style="background-image:url('https://shwinandshwin.com/wp-content/uploads/2017/08/UpBath.jpg')"></div><div class="ba-layer ba-after" style="background-image:url('https://shwinandshwin.com/wp-content/uploads/2017/08/UpBath.jpg')"></div><div class="ba-label before">ДО</div><div class="ba-label after">ПОСЛЕ</div><input class="ba-range" type="range" min="0" max="100" value="50" aria-label="Сравнить до и после"></div><p>Пример обновления ванной комнаты.</p></article></div><div class="works-note">Фотографии использованы как визуальные примеры. Они не являются выполненными объектами ALTAIR GROUP.</div></div></section>'''
          s=s[:start]+new+s[end:]
          s=s.replace('.gallery{display:grid;', '.ba-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.ba-card{background:var(--surface);border:1px solid #202a31;padding:18px}.ba-title{font-size:22px;font-weight:800;margin-bottom:14px}.ba-slider{position:relative;height:360px;overflow:hidden;background:#111;touch-action:none}.ba-layer{position:absolute;inset:0;background-size:200% 100%;background-repeat:no-repeat}.ba-before{background-position:left center}.ba-after{background-position:right center;width:50%;overflow:hidden}.ba-range{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize}.ba-slider:after{content:"";position:absolute;top:0;bottom:0;left:50%;width:3px;background:var(--accent);pointer-events:none;transform:translateX(-50%)}.ba-label{position:absolute;top:14px;padding:5px 9px;background:rgba(7,16,24,.8);font-size:11px;font-weight:800;letter-spacing:.1em;z-index:2;pointer-events:none}.ba-label.before{left:14px}.ba-label.after{right:14px}.ba-card p{color:var(--muted);font-size:13px;margin:12px 0 0}.works-note{margin-top:18px;color:var(--muted);font-size:12px}.gallery{display:grid;')
          s=s.replace('@media(max-width:850px){', '@media(max-width:850px){.ba-grid{grid-template-columns:1fr}.ba-slider{height:300px}')
          phone='<a class="call-float" href="tel:+77073749855" aria-label="Позвонить в ALTAIR GROUP">☎ Позвонить</a>'
          s=s.replace('</body>', phone+'</body>')
          s=s.replace('.reveal{opacity:0;', '.call-float{position:fixed;right:18px;bottom:18px;z-index:30;background:var(--accent);color:#17130d;padding:13px 18px;border-radius:30px;font-weight:900;box-shadow:0 8px 25px rgba(0,0,0,.35)}.call-float:hover{transform:translateY(-2px)}.reveal{opacity:0;')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Redesign apartment before after gallery and add call button" || exit 0
          git push
