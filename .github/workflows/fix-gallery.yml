name: Update ALTAIR gallery
on:
  push:
    paths:
      - trigger-gallery-3.txt
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace gallery
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          a=s.index('<section id="works">')
          b=s.index('</section>',a)+10
          before1='https://commons.wikimedia.org/wiki/Special:FilePath/SovietLivingRoom1950s.jpg'
          after1='https://commons.wikimedia.org/wiki/Special:FilePath/Living_room_in_apartment_of_Condom%C3%ADnio_do_Edif%C3%ADcio_Zaher%2C_Le_Blond%2C_Rio_de_Janeiro%2C_Brazil.jpg'
          before2='https://commons.wikimedia.org/wiki/Special:FilePath/Kivila_11_-_kitchen_prepared_fro_reconstruction.JPG'
          after2='https://commons.wikimedia.org/wiki/Special:FilePath/Apartment_Kitchen_with_Sink_and_Oven.jpg'
          before3='https://commons.wikimedia.org/wiki/Special:FilePath/Bathroom_in_Tallinn_2.jpg'
          after3='https://commons.wikimedia.org/wiki/Special:FilePath/Bathroom_%E2%80%93_​​Panorama_%28Greg_Zaal_via_Poly_Haven%29.jpg'
          def card(title,before,after,desc):
              return f'''<article class="ba-card"><h3>{title}</h3><div class="ba-slider"><img class="ba-img ba-after" src="{after}" alt="{title} после ремонта"><div class="ba-before-wrap"><img class="ba-img" src="{before}" alt="{title} до ремонта"></div><span class="ba-tag ba-tag-left">ДО</span><span class="ba-tag ba-tag-right">ПОСЛЕ</span><input class="ba-range" type="range" min="0" max="100" value="50" aria-label="{title}: до и после"></div><p>{desc}</p></article>'''
          new='''<section id="works"><div class="container"><div class="section-head reveal"><div><div class="section-kicker">04 / Примеры ремонта квартир</div><h2>До →<br>После.</h2></div><p class="section-intro">Потяните ползунок и посмотрите контраст между старым интерьером и современным ремонтом квартиры.</p></div><div class="ba-grid reveal">'''+card('Гостиная',before1,after1,'Старая советская гостиная → современный интерьер квартиры.')+card('Кухня',before2,after2,'Старая кухня в советской квартире → современная кухня после ремонта.')+card('Санузел',before3,after3,'Старый санузел хрущёвки → современный санузел после ремонта.')+'''</div><div class="works-note">Фотографии из открытых библиотек с разрешённым свободным использованием. Это визуальные примеры, а не выполненные объекты ALTAIR GROUP.</div></div></section>'''
          s=s[:a]+new+s[b:]
          css='''.ba-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.ba-card{background:var(--surface);border:1px solid #202a31;padding:18px}.ba-card h3{font-size:24px;margin:0 0 14px}.ba-slider{position:relative;height:390px;overflow:hidden;background:#111;touch-action:none}.ba-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.ba-before-wrap{position:absolute;inset:0;width:50%;overflow:hidden;z-index:2;border-right:3px solid var(--accent)}.ba-before-wrap .ba-img{width:calc(100vw);max-width:none;right:auto}.ba-range{position:absolute;left:4%;bottom:14px;width:92%;z-index:5;accent-color:var(--accent);cursor:ew-resize}.ba-tag{position:absolute;top:14px;z-index:4;background:rgba(7,16,24,.85);padding:6px 9px;font-size:11px;font-weight:900;letter-spacing:.1em}.ba-tag-left{left:14px}.ba-tag-right{right:14px}.ba-card p{color:var(--muted);font-size:13px;margin:12px 0 0}.works-note{margin-top:18px;color:var(--muted);font-size:12px}@media(max-width:850px){.ba-grid{grid-template-columns:1fr}.ba-slider{height:330px}}'''
          s=s.replace('</style>',css+'</style>',1)
          old="document.querySelectorAll('.ba-slider').forEach(slider=>{const range=slider.querySelector('.ba-range'),right=slider.querySelector('.ba-right');const upd=()=>right.style.width=range.value+'%';range.addEventListener('input',upd);upd()})"
          newjs="document.querySelectorAll('.ba-slider').forEach(slider=>{const range=slider.querySelector('.ba-range'),before=slider.querySelector('.ba-before-wrap');const upd=()=>before.style.width=range.value+'%';range.addEventListener('input',upd);upd()})"
          s=s.replace(old,newjs)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit site update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Replace gallery with apartment renovation examples"
          git push
