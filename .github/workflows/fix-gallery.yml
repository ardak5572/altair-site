name: Fix ALTAIR before after gallery
on:
  push:
    paths:
      - trigger-gallery-2.txt
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace gallery with apartment examples
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          a=s.index('<section id="works">'); b=s.index('</section>',a)+10
          img1='https://frankfurt.apollo.olxcdn.com/v1/files/xe0aibfvnnvc2-KZ/image%3Bs%3D784x1168'
          img2='https://centerstone.ae/wp-content/uploads/2023/09/photo-output.jpg'
          img3='https://shwinandshwin.com/wp-content/uploads/2017/08/UpBath.jpg'
          def card(title,img,desc):
              return f'''<article class="ba-card"><h3>{title}</h3><div class="ba-slider"><div class="ba-side ba-left" style="background-image:url(\'{img}\')"></div><div class="ba-side ba-right" style="background-image:url(\'{img}\')"></div><span class="ba-tag ba-tag-left">ДО</span><span class="ba-tag ba-tag-right">ПОСЛЕ</span><input class="ba-range" type="range" min="0" max="100" value="50" aria-label="{title}: до и после"></div><p>{desc}</p></article>'''
          new='''<section id="works"><div class="container"><div class="section-head reveal"><div><div class="section-kicker">04 / Примеры ремонта</div><h2>До →<br>После.</h2></div><p class="section-intro">Примеры ремонта квартир. Потяните ползунок — слева состояние до ремонта, справа результат после ремонта.</p></div><div class="ba-grid reveal">'''+card('Гостиная',img1,'Визуальный пример ремонта жилой комнаты.')+card('Кухня',img2,'Визуальный пример полного обновления кухни.')+card('Санузел',img3,'Визуальный пример обновления ванной комнаты.')+'''</div><div class="works-note">Фотографии представлены только как визуальные примеры. Это не выполненные объекты ALTAIR GROUP. После появления наших первых объектов заменим их на реальные фотографии «до / после».</div></div></section>'''
          s=s[:a]+new+s[b:]
          css='''.ba-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.ba-card{background:var(--surface);border:1px solid #202a31;padding:18px}.ba-card h3{font-size:24px;margin:0 0 14px}.ba-slider{position:relative;height:390px;overflow:hidden;background:#111;touch-action:none}.ba-side{position:absolute;inset:0;background-size:200% 100%;background-repeat:no-repeat}.ba-left{background-position:left center}.ba-right{background-position:right center;width:50%;overflow:hidden;border-right:3px solid var(--accent);z-index:2}.ba-range{position:absolute;left:4%;bottom:14px;width:92%;z-index:5;accent-color:var(--accent);cursor:ew-resize}.ba-tag{position:absolute;top:14px;z-index:4;background:rgba(7,16,24,.85);padding:6px 9px;font-size:11px;font-weight:900;letter-spacing:.1em}.ba-tag-left{left:14px}.ba-tag-right{right:14px}.ba-card p{color:var(--muted);font-size:13px;margin:12px 0 0}.works-note{margin-top:18px;color:var(--muted);font-size:12px}@media(max-width:850px){.ba-grid{grid-template-columns:1fr}.ba-slider{height:330px}}'''
          s=s.replace('</style>',css+'</style>',1)
          old="const baRange=document.getElementById('baRange'),baBefore=document.getElementById('baBefore');if(baRange&&baBefore){const upd=()=>baBefore.style.width=baRange.value+'%';baRange.addEventListener('input',upd);upd()}"
          newjs="document.querySelectorAll('.ba-slider').forEach(slider=>{const range=slider.querySelector('.ba-range'),right=slider.querySelector('.ba-right');const upd=()=>right.style.width=range.value+'%';range.addEventListener('input',upd);upd()})"
          s=s.replace(old,newjs)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use apartment before after examples" || exit 0
          git push
